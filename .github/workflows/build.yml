name: Build Worldcast

on:
  push:
    branches: [main]
  workflow_dispatch:

# The iPhone/iPad app, released for the AltStore / SideStore source at apps.illixion.com.
# Every release carries it under one fixed name, Worldcast-iOS-unsigned.ipa, so
# releases/latest/download/Worldcast-iOS-unsigned.ipa always points at the newest one and
# the source can point each version at its own tag.
jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      # Full history: the build number is the commit count (see below).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The iOS target needs the 26.5 SDK.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      # AltStore offers an update only when CFBundleVersion grows; the commit count on
      # main always grows.
      - name: Archive for iPhone and iPad
        run: |
          xcodebuild -quiet archive \
            -project Worldcast/Worldcast.xcodeproj \
            -scheme Worldcast \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Worldcast.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)"

      # AltStore re-signs with the user's Apple ID, and on a free account every embedded
      # extension or Watch app costs another App ID. The Watch app is dropped here; the
      # iPhone app works without it.
      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/Worldcast.xcarchive/Products/Applications/Worldcast.app"
          rm -rf "$APP/Watch"
          for d in PlugIns Watch Extensions; do
            [[ ! -d "$APP/$d" ]] || { echo "::error::Worldcast.app embeds $d"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Worldcast-iOS-unsigned.ipa" Payload

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.1.0-${GITHUB_SHA::8}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --notes "Built from \`$VERSION\`. \`Worldcast-iOS-unsigned.ipa\` is the iPhone and iPad app without its Watch app. Install it through AltStore or SideStore from https://apps.illixion.com, which keeps it updated." \
            Worldcast-iOS-unsigned.ipa
